services:
  postgres:
    image: postgres:17
    restart: always
    container_name: shop-postgres
    environment:
      POSTGRES_DB: melodia
      POSTGRES_USER: melodia
      POSTGRES_PASSWORD: Melodia123!
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
