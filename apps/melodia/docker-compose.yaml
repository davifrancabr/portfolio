services:
  postgres:
    image: postgres:17
    restart: always
    container_name: melodia-postgres
    environment:
      POSTGRES_DB: melodia
      POSTGRES_USER: melodia
      POSTGRES_PASSWORD: Melodia123!
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  adminer:
    image: adminer
    container_name: adminer
    depends_on:
      - postgres
    environment:
      - ADMINER_DEFAULT_SERVER=postgres
    ports:
      - 8080:8080

volumes:
  postgres_data:
